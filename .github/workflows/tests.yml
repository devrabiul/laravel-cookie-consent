name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '8.*',  testbench: '6.*',  php: '8.0' }
          - { laravel: '8.*',  testbench: '6.*',  php: '8.1' }
          - { laravel: '9.*',  testbench: '7.*',  php: '8.0' }
          - { laravel: '9.*',  testbench: '7.*',  php: '8.2' }
          - { laravel: '10.*', testbench: '8.*',  php: '8.1' }
          - { laravel: '10.*', testbench: '8.*',  php: '8.3' }
          - { laravel: '11.*', testbench: '9.*',  php: '8.2' }
          - { laravel: '11.*', testbench: '9.*',  php: '8.4' }
          - { laravel: '12.*', testbench: '10.*', php: '8.2' }
          - { laravel: '12.*', testbench: '10.*', php: '8.4' }
          - { laravel: '13.*', testbench: '11.*', php: '8.3' }
          - { laravel: '13.*', testbench: '11.*', php: '8.4' }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: node --check assets/js/script.js

      - name: Run tests
        run: node --test tests/js/consent.test.mjs
